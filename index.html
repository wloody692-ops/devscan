<script>
const API_KEY="ضع_مفتاحك_هنا";
const SYMBOL="EUR/USD";

function EMA(v,p){
 if(v.length<p)return null;
 let e=v.slice(0,p).reduce((a,b)=>a+b,0)/p;
 let m=2/(p+1);
 for(let i=p;i<v.length;i++)e=(v[i]-e)*m+e;
 return e;
}

function RSI(v,p=7){
 let g=0,l=0;
 for(let i=1;i<=p;i++){
  let d=v[i]-v[i-1];
  if(d>0)g+=d;else l-=d;
 }
 let ag=g/p,al=l/p;
 for(let i=p+1;i<v.length;i++){
  let d=v[i]-v[i-1];
  ag=(ag*(p-1)+(d>0?d:0))/p;
  al=(al*(p-1)+(d<0?-d:0))/p;
 }
 if(al===0)return 100;
 return 100-(100/(1+ag/al));
}

function trend5(c){
 let v=c.map(x=>+x.close);
 let a=v.slice(-5).reduce((x,y)=>x+y,0)/5;
 let b=v.slice(-10,-5).reduce((x,y)=>x+y,0)/5;
 return a>b?"صاعد":a<b?"هابط":"محايد";
}

function signal(r,e9,e26,t){

 /*
  فلتر صارم:
  شراء فقط RSI 56-68
  بيع فقط RSI 32-44
  EMA 9/26 متوافق
  اتجاه 5M متوافق
 */

 if(e9>e26 && r>=56 && r<=68 && t==="صاعد")
  return ["🟢 شراء","buy",
  "توافق قوي: EMA 9/26 + RSI 7 + اتجاه 5M"];

 if(e9<e26 && r>=32 && r<=44 && t==="هابط")
  return ["🔴 بيع","sell",
  "توافق قوي: EMA 9/26 + RSI 7 + اتجاه 5M"];

 return ["🟡 انتظار","wait",
 "لا توجد صفقة قوية الآن"];
}

async function loadData(){

 const status=document.getElementById("status");

 try{

  const url=
  "https://api.twelvedata.com/time_series"+
  "?apikey="+encodeURIComponent(API_KEY)+
  "&interval=1min"+
  "&symbol="+encodeURIComponent(SYMBOL)+
  "&outputsize=100"+
  "&format=JSON";

  const res=await fetch(url);
  const data=await res.json();

  if(data.status==="error")
   throw new Error(data.message);

  const c=data.values.reverse();
  const v=c.map(x=>+x.close);

  const price=v.at(-1);
  const e9=EMA(v,9);
  const e26=EMA(v,26);
  const r=RSI(v,7);
  const t=trend5(c);

  const s=signal(r,e9,e26,t);

  document.getElementById("price").textContent=price.toFixed(5);
  document.getElementById("rsi").textContent=r.toFixed(2);
  document.getElementById("ema9").textContent=e9.toFixed(5);
  document.getElementById("ema26").textContent=e26.toFixed(5);
  document.getElementById("trend").textContent=t;
  document.getElementById("time").textContent=c.at(-1).datetime;

  const box=document.getElementById("signal");
  box.textContent=s[0];
  box.className="signalText "+s[1];

  document.getElementById("reason").textContent=s[2];

  status.textContent=
  "✅ آخر تحديث: "+
  new Date().toLocaleTimeString("ar-SA");

 }catch(e){
  status.textContent="❌ "+e.message;
 }
}

loadData();
setInterval(loadData,60000);
</script>
